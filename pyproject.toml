[build-system]
requires = [
    "meson-python>=0.19.0",
    "meson>=1.9.1",
    "pybind11>=2.10"
]
build-backend = "mesonpy"

[project]
name = "gridfire"
version = "v0.7.6rc4.2"
description = "Python interface to the GridFire nuclear network code"
readme = "README.md"
license = { file = "LICENSE.txt" }

authors = [
    {name = "Emily M. Boudreaux", email = "emily@boudreauxmail.com"},
    {name = "Aaron Dotter", email = "aaron.dotter@gmail.com"}
]
maintainers = [
    {name = "Emily M. Boudreaux", email = "emily@boudreauxmail.com"}
]

[tool.meson-python.args]
setup = [
    '-Ddefault_library=static',
    '-Dpkg_config=false',
    '-Dbuildtype=release',
    '-Dopenmp_support=true',
    '-Dasan=false',
    '-Dlog_level=error',
    '-Dbuild_tests=false',
    '-Dbuild_c_api=false',
    '-Dbuild_examples=false',
    '-Dbuild_benchmarks=false',
    '-Dbuild_tools=false',
    '-Dplugin_support=false',
    '-Duse_mimalloc=false',
    '-Dbuild_python=true'
]
install = ['--skip-subprojects']
